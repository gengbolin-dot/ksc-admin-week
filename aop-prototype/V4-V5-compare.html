<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 vs V5 视觉对比 — AOP平台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter','Noto Sans SC',sans-serif;background:#18181B;color:#FAFAFA;overflow:hidden;height:100vh;display:flex;flex-direction:column}
  .bar{height:52px;background:#18181B;border-bottom:1px solid #27272A;display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
  .bar-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .bar-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:#4F46E5;color:#fff}
  .bar-hint{font-size:12px;color:#A1A1AA;margin-left:auto}
  .bar-btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #3F3F46;background:#27272A;color:#FAFAFA;transition:.15s}
  .bar-btn:hover{background:#3F3F46;border-color:#52525B}
  .bar-btn.act{background:#4F46E5;border-color:#4F46E5;color:#fff}
  .split{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid #27272A}
  .pane:last-child{border-right:none}
  .pane-head{height:36px;background:#27272A;display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
  .pane-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
  .pane-tag.v4{background:#3B5BDB;color:#fff}
  .pane-tag.v5{background:#4F46E5;color:#fff}
  .pane-label{font-size:12px;color:#A1A1AA}
  .pane-info{font-size:11px;color:#52525B;margin-left:auto}
  iframe{flex:1;border:none;background:#FAFAFA}
</style>
</head>
<body>
  <div class="bar">
    <div class="bar-title">AOP 行政运营管理平台</div>
    <div class="bar-badge">V4 → V5 视觉对比</div>
    <div class="bar-hint">左右拖动对比 · 点击下方按钮切换模块（两版同步）</div>
    <button class="bar-btn act" data-p="p02" onclick="go('p02')">我的工作(主页)</button>
    <button class="bar-btn" data-p="p12" onclick="go('p12')">经营复盘</button>
    <button class="bar-btn" data-p="p17" onclick="go('p17')">行政制度</button>
    <button class="bar-btn" data-p="p26" onclick="go('p26')">AI生成器</button>
    <button class="bar-btn" data-p="p04" onclick="go('p04')">行政概览</button>
  </div>
  <div class="split">
    <div class="pane">
      <div class="pane-head">
        <span class="pane-tag v4">V4</span>
        <span class="pane-label">旧版 · 蓝黑侧栏 + 蓝主色 + 微软雅黑</span>
        <span class="pane-info">主色 #3B5BDB · 圆角 10-18px</span>
      </div>
      <iframe id="f4" src="AOP平台V4/aop-full.html"></iframe>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span class="pane-tag v5">V5</span>
        <span class="pane-label">新版 · 中性深灰 + indigo + Inter</span>
        <span class="pane-info">主色 #4F46E5 · 圆角 8-14px</span>
      </div>
      <iframe id="f5" src="AOP平台V5/aop-full.html"></iframe>
    </div>
  </div>
<script>
  function go(p){
    document.querySelectorAll('.bar-btn').forEach(b=>b.classList.toggle('act', b.dataset.p===p));
    const f4 = document.getElementById('f4');
    const f5 = document.getElementById('f5');
    f4.onload = ()=>{ try{ f4.contentWindow.switchPanel(p); }catch(e){} };
    f5.onload = ()=>{ try{ f5.contentWindow.switchPanel(p); }catch(e){} };
    // 已加载过则直接切
    try{ f4.contentWindow.switchPanel(p); }catch(e){ f4.src='AOP平台V4/aop-full.html'; }
    try{ f5.contentWindow.switchPanel(p); }catch(e){ f5.src='AOP平台V5/aop-full.html'; }
  }
  window.addEventListener('load', ()=>setTimeout(()=>go('p02'), 600));
</script>
</body>
</html>
